<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>招商复色标准指南 · 男内 / 童内</title>
<style>
:root{
  --ink:#16202E; --ink2:#2C3A4C; --body:#3B4A5C; --muted:#68788B; --faint:#95A3B2;
  --accent:#F08A24; --accent-d:#C4690F; --accent-soft:#FFF3E3; --accent-line:#F3D2AB;
  --ok:#0E7C6B; --ok-bg:#E8F7F2;
  --try:#2C5AA8; --try-bg:#EDF3FC;
  --drop:#A61B45; --drop-bg:#FCEDF2;
  --hold:#5B6878; --hold-bg:#EFF2F6;
  --line:#E1E7EE; --line2:#EDF1F5; --bg:#F3F5F8; --card:#fff;
  --stage:clamp(266px,34vh,404px); --rail:98px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sw:20px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--body);font-size:15.8px;line-height:1.66;
  font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  background-color:var(--bg);
  background-image:radial-gradient(circle at 1px 1px,rgba(22,32,46,.045) 1px,transparent 0);
  background-size:22px 22px;
  padding-top:calc(var(--stage) + var(--rail));
}
h1,h2,h3,h4{margin:0;color:var(--ink);font-weight:700;line-height:1.28}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:#FFE0BC;color:var(--ink)}

/* ================= STAGE : fixed report head ================= */
.stage{
  position:fixed;top:0;left:0;right:0;z-index:80;height:var(--stage);
  background:linear-gradient(180deg,#FFFFFF 0%,#FCFDFE 62%,#F8FAFC 100%);
  border-bottom:1px solid var(--line);
  box-shadow:0 8px 24px -18px rgba(22,32,46,.35);
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
}
.stage::-webkit-scrollbar{display:none}
.stage-inner{
  max-width:1280px;margin:0 auto;min-height:100%;
  padding:clamp(14px,1.9vh,20px) clamp(20px,3vw,40px) 14px;
  display:grid;grid-template-columns:minmax(276px,.76fr) minmax(0,1.64fr);
  grid-template-rows:1fr auto;gap:12px clamp(18px,2.2vw,28px);
  align-content:center;
}
.title-col{display:flex;flex-direction:column;justify-content:center;min-width:0}
.eyebrow{font-family:var(--mono);font-size:10.6px;font-weight:700;letter-spacing:.24em;color:var(--accent);white-space:nowrap}
.title-col h1{font-size:clamp(21px,2.35vw,33px);letter-spacing:-.025em;margin:6px 0 5px;line-height:1.15}
.title-col .sub{font-size:13px;color:var(--muted)}
.title-col .tag{font-size:12.4px;color:var(--faint);margin-top:6px;line-height:1.55}
.title-col .tag b{color:var(--accent-d);font-weight:700}
.title-col .lead{font-size:11.4px;color:var(--faint);margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);letter-spacing:.01em}

.q-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0;align-items:center}
.qcard{
  position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:12px 15px 13px;overflow:hidden;min-width:0;
  box-shadow:0 1px 2px rgba(22,32,46,.03);
}
.qcard::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent),#F9C077 70%,rgba(249,192,119,0))}
.qh{display:flex;align-items:baseline;gap:8px;min-width:0}
.qlab{font-family:var(--mono);font-size:10.6px;font-weight:800;color:var(--accent);letter-spacing:.08em}
.qh h3{font-size:15.6px;letter-spacing:-.01em;white-space:nowrap}
.qsub{font-size:11.6px;color:var(--muted);margin-top:2px}
.qlines{list-style:none;margin:8px 0 0;padding:8px 0 0;border-top:1px dashed var(--line);display:grid;gap:3px}
.qlines li{position:relative;padding-left:12px;font-size:12.2px;line-height:1.52;color:var(--body)}
.qlines li::before{content:"";position:absolute;left:0;top:.64em;width:4px;height:4px;border-radius:50%;background:#C9D3DF}
.qfoot{display:inline-block;margin-top:7px;font-size:11px;font-weight:700;color:var(--accent-d);
  background:var(--accent-soft);border:1px solid #FBE3C8;padding:2px 8px;border-radius:5px}

.blocks{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr) minmax(160px,.72fr);
  border-top:1px solid var(--line2);padding-top:9px;gap:0;min-width:0}
.blk{display:flex;gap:10px;align-items:flex-start;padding:0 18px 0 0;min-width:0}
.blk .no{font-family:var(--mono);font-size:10.6px;font-weight:800;color:var(--accent);padding-top:2px;letter-spacing:.04em}
.blk h4{font-size:12.6px;letter-spacing:.01em;white-space:nowrap}
.blk p{font-size:11.2px;color:var(--muted);line-height:1.45;margin-top:1px}
.blk.t{flex-direction:column;gap:0;border-left:1px solid var(--line2);padding-left:18px}
.blk.t h4{font-size:12.2px;color:var(--accent-d)}

/* ================= RAIL : centered tabs + chips ================= */
.rail{
  position:fixed;top:var(--stage);left:0;right:0;z-index:79;height:var(--rail);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:9px 0 10px;
  background:rgba(255,255,255,.93);backdrop-filter:saturate(1.7) blur(12px);
  border-bottom:1px solid var(--line);
}
.tabrow,.chipsrow{width:100%;max-width:1280px;padding:0 clamp(20px,3vw,40px)}
.tabrow{position:relative;display:flex;justify-content:center}
.seg{display:flex;gap:3px;padding:3px;background:#EAEEF4;border-radius:11px}
.tab{
  display:flex;align-items:center;gap:7px;padding:6px 19px;border-radius:9px;
  font-size:14.4px;font-weight:600;color:var(--muted);transition:.2s;white-space:nowrap;
}
.tab i{font-family:var(--mono);font-style:normal;font-size:10.6px;font-weight:700;color:var(--faint)}
.tab:hover{color:var(--ink2)}
.tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(22,32,46,.14)}
.tab[aria-selected="true"] i{color:var(--accent)}
.trend-btn{position:absolute;right:clamp(20px,3vw,40px);top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:8px;
  font-size:12.6px;color:var(--muted);border:1px solid var(--line);background:#fff;transition:.18s;white-space:nowrap}
.trend-btn:hover{color:var(--accent-d);border-color:var(--accent-line);background:#FFFBF5}
.chipsrow{overflow-x:auto;scrollbar-width:none}
.chipsrow::-webkit-scrollbar{display:none}
.chips{display:flex;gap:7px;width:max-content;margin:0 auto;padding:1px 2px}
.chip{
  padding:5px 14px;border-radius:999px;font-size:13.4px;color:var(--body);
  border:1px solid transparent;transition:.18s;white-space:nowrap;
}
.chip:hover{background:#fff;border-color:var(--line);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 2px 8px -2px rgba(22,32,46,.45)}

/* ================= MAIN ================= */
main{max-width:1280px;margin:0 auto;padding:20px clamp(20px,3vw,40px) 72px}
.view{animation:fadeUp .28s cubic-bezier(.22,.7,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.cat-top{display:flex;align-items:flex-start;gap:15px;margin-bottom:16px}
.bignum{flex:none;font-family:var(--mono);font-size:clamp(28px,3.6vw,42px);font-weight:800;
  color:#D7DFE8;line-height:.95;letter-spacing:-.05em;padding-top:1px;min-width:2.1ch}
.cat-title{flex:1;min-width:0}
.cat-title .g{font-size:12.4px;font-weight:700;letter-spacing:.16em;color:var(--accent);display:block}
.cat-title h2{font-size:clamp(24px,2.8vw,33px);letter-spacing:-.02em;margin:2px 0 3px}
.cat-title h2 em{font-style:normal;font-family:var(--mono);font-size:.42em;font-weight:700;color:var(--faint);
  margin-left:10px;letter-spacing:0;vertical-align:.24em}
.cat-title .lede{font-size:13.4px;color:var(--muted);line-height:1.55}
.pager{flex:none;display:flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px}
.pg{width:32px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:19px;line-height:1;color:var(--muted);transition:.16s}
.pg:hover:not(:disabled){background:#F3F5F8;color:var(--ink)}
.pg:disabled{opacity:.28;cursor:not-allowed}
.pgc{font-family:var(--mono);font-size:12px;color:var(--faint);padding:0 7px;white-space:nowrap}
.pgc b{color:var(--ink);font-weight:700}

/* ---- table : single-line priority ---- */
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(22,32,46,.04)}
.twrap{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1140px;font-size:13.6px;table-layout:fixed}
thead th{
  background:#F5F8FB;color:var(--ink2);font-size:12.4px;font-weight:700;letter-spacing:.015em;
  text-align:left;white-space:nowrap;padding:11px 12px;border-bottom:1px solid var(--line);
}
thead th:first-child{position:sticky;left:0;z-index:3;background:#F5F8FB}
thead th:nth-child(6){text-align:center}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;color:var(--body);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FCFDFF}
td.c1{font-weight:700;color:var(--ink);position:sticky;left:0;z-index:1;background:#fff;
  border-right:1px solid var(--line2)}
tbody tr:hover td.c1{background:#FCFDFF}
td.pri{text-align:left}
.pill{display:inline-block;font-family:var(--mono);font-size:11.4px;font-weight:800;letter-spacing:.03em;
  padding:1px 8px;border-radius:5px;background:var(--hold-bg);color:var(--hold)}
.pill.p0{background:var(--accent-soft);color:var(--accent-d);border:1px solid #FBE3C8}
.pill.p1{background:var(--try-bg);color:var(--try)}
td.num{font-family:var(--mono);font-weight:700;color:var(--ink);text-align:right;font-size:13.4px}
td.width{font-family:var(--mono);font-weight:700;color:var(--ink);font-size:13.6px;text-align:center}
td.picks{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.78;padding-right:14px}
td.picks .tok{white-space:nowrap}
td.picks b{color:var(--accent-d);font-weight:700;font-family:var(--mono);font-size:12.2px;letter-spacing:.02em;
  white-space:nowrap}

/* ---- blocks ---- */
.edcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  margin-top:14px;box-shadow:0 1px 2px rgba(22,32,46,.04)}
.chead{display:flex;align-items:center;gap:9px;padding:12px 16px 0}
.chead h3{font-size:13.8px;letter-spacing:.01em}
.chead .tag{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.06em;margin-left:auto}
.concl{
  margin:12px 16px 15px;padding:11px 15px;border-radius:0 9px 9px 0;
  border-left:4px solid var(--accent);background:linear-gradient(90deg,#FFF7EC,#FFFDFA);
  font-size:13.2px;font-weight:700;color:var(--accent-d);line-height:1.62;
}

.vcard{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px;
  box-shadow:0 1px 2px rgba(22,32,46,.04)}
.vcard .chead{padding-bottom:9px}
.vnote{padding:0 16px;font-size:12px;color:var(--faint);line-height:1.55}
.vgrid{list-style:none;margin:0;padding:11px 16px 15px;display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));gap:3px 18px}
.vgrid li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;
  min-width:0;transition:.15s;border:1px solid transparent}
.vgrid li:hover{background:#FAFBFD;border-color:var(--line2)}
.vgrid .nm{font-size:13.6px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.sw{
  flex:none;display:block;width:var(--sw);height:var(--sw);border-radius:6px;
  box-shadow:inset 0 0 0 1px rgba(22,32,46,.12),0 1px 2px rgba(22,32,46,.08);
}
.vgrid .sw{--sw:clamp(20px,1.6vw,25px);border-radius:7px}
.panel .sw{--sw:18px}
.badge{flex:none;margin-left:auto;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.02em}
.b-ok{color:var(--ok);background:var(--ok-bg)}
.b-try{color:var(--try);background:var(--try-bg)}
.b-off{color:var(--drop);background:var(--drop-bg)}
.b-main{color:var(--accent-d);background:var(--accent-soft)}
.b-dir{color:#3730A3;background:#EEF2FF}
.b-follow{color:var(--hold);background:var(--hold-bg)}
.b-recycle{color:#9F1239;background:var(--drop-bg)}
.b-cut{color:#B91C1C;background:#FEF2F2}
.b-stop{color:#64748B;background:#F1F5F9}

.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  position:relative;box-shadow:0 1px 2px rgba(22,32,46,.04)}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.panel.add::before{background:linear-gradient(180deg,#5FBFA8,#8FD3C3 60%,rgba(143,211,195,0))}
.panel.drop::before{background:linear-gradient(180deg,#D98CA4,#EFC0CE 60%,rgba(239,192,206,0))}
.panel .chead{padding:12px 16px 0 18px}
.panel .chead h3{font-size:13.6px}
.plist{list-style:none;margin:0;padding:7px 16px 14px 18px;display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.plist li{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed #F0F3F7;min-width:0}
.plist li:last-child{border-bottom:0}
.plist .nm{font-size:13.2px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.ribbon{
  margin-top:14px;display:flex;align-items:center;gap:13px;
  background:linear-gradient(100deg,#16202E,#22303F 72%,#26374A);
  border-radius:12px;padding:14px 20px;color:#EAF0F6;position:relative;overflow:hidden;
  box-shadow:0 6px 18px -12px rgba(22,32,46,.7);
}
.ribbon::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),#FBC688)}
.ribbon p{font-size:13.8px;line-height:1.62;color:#E6EDF4;font-weight:600}
.ribbon .mk{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:#8FA2B5;flex:none}

/* ---- trend ---- */
.tview{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px clamp(18px,2.6vw,30px);
  box-shadow:0 1px 2px rgba(22,32,46,.04)}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}
.tcol h4{font-size:12.8px;letter-spacing:.02em;padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:10px;color:var(--ink2)}
.tcw{display:flex;gap:13px;align-items:center;padding:7px 0}
.tcw .box{flex:none;width:clamp(46px,4.4vw,58px);height:clamp(46px,4.4vw,58px);border-radius:10px;
  box-shadow:inset 0 0 0 1px rgba(22,32,46,.1),0 1px 3px rgba(22,32,46,.07)}
.tcw .cn{font-size:13.6px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcw .en{font-size:11.6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcw .rgb{font-family:var(--mono);font-size:10.4px;color:var(--faint);margin-top:1px;letter-spacing:.02em}
.tfoot{margin-top:20px;padding:14px 17px;border-left:4px solid var(--accent);background:var(--accent-soft);
  border-radius:0 9px 9px 0;display:grid;gap:5px}
.tfoot p{font-size:13px;color:var(--accent-d);font-weight:600;line-height:1.62}
footer{margin-top:24px;padding-top:15px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
  gap:12px;flex-wrap:wrap;font-size:12px;color:var(--faint)}

/* ================= responsive ================= */
@media (max-height:820px){:root{--stage:clamp(248px,32vh,330px)}}
@media (max-width:1120px){
  .vgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tgrid{grid-template-columns:repeat(2,1fr)}
  .title-col h1{font-size:clamp(20px,2.7vw,28px)}
}
@media (max-width:900px){
  :root{--stage:clamp(250px,36vh,382px);--rail:96px}
  .stage-inner{grid-template-columns:1fr;grid-template-rows:auto auto auto;gap:9px;align-content:start}
  .title-col{justify-content:flex-start}
  .cat-title .lede{font-size:12.6px}
}
@media (max-width:720px){
  :root{--stage:clamp(236px,38vh,400px);--rail:92px}
  .stage-inner{padding:10px 16px 9px}
  .q-row{gap:9px}
  .qh h3{font-size:14px}
  .qsub{font-size:10.8px}
  .qlines li{font-size:11.2px}
  .blocks{grid-template-columns:1fr 1fr;row-gap:7px;padding-top:7px}
  .blk:nth-child(2){padding-right:0}
  .blk.t{grid-column:1/-1;border-left:0;padding-left:0;border-top:1px dashed var(--line2);padding-top:6px}
  .blk h4{font-size:11.6px}
  .blk p{font-size:10.6px}
  .tabrow,.chipsrow{padding:0 12px}
  .tab{padding:6px 14px;font-size:13.6px}
  .trend-btn{right:12px;padding:5px 9px;font-size:11.6px}
  .trend-btn span{display:none}
  .chip{font-size:12.4px;padding:5px 11px}
  main{padding:16px 16px 60px}
  .vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panels{grid-template-columns:1fr}
  .plist{grid-template-columns:1fr}
  .bignum{display:none}
  .cat-top{gap:10px}
.concl{margin:11px 12px 13px;font-size:12.6px}
  .ribbon{padding:12px 15px}
  .ribbon p{font-size:12.8px}
}
@media (max-width:520px){
  .title-col .tag{font-size:11px}
  .vgrid{grid-template-columns:1fr}
  .tgrid{grid-template-columns:1fr}
  .pgc{font-size:11px;padding:0 4px}
}
@media print{
  body{padding-top:0;background:#fff}
  .stage,.rail{position:static;height:auto}
  .view{animation:none}
}
</style>
</head>
<body>

<header class="stage" id="stage"><div class="stage-inner" id="stageInner"></div></header>

<div class="rail">
  <div class="tabrow">
    <div class="seg" role="tablist" aria-label="一级分组" id="seg"></div>
    <button class="trend-btn" id="trendBtn">社媒趋势<span> →</span></button>
  </div>
  <div class="chipsrow"><nav class="chips" id="chips" aria-label="品类导航"></nav></div>
</div>

<main>
  <div id="view"></div>
  <footer id="foot"></footer>
</main>

<script type="application/json" id="site-data">{
 "meta": {
  "categories": 14,
  "groups": [
   "男内",
   "童内"
  ]
 },
 "cover": {

  "tagline": "整份指南只回答两个问题：复几个颜色 & 复什么颜色",
  "q1": {

    "超过峰值后爆旺率快速回落，回落前的最后一档就是封顶",
    "两者之间即推荐 SKC 宽度"
   ],
   "foot": ""
  },
  "q2": {
   "label": "Q2",
   "title": "复什么颜色？",

   ],

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('site-data').textContent);
  const GROUPS = ['男内','童内'];
  const TAG = {'可复':'b-ok','试色':'b-try','已汰换':'b-off','主推':'b-main','定向':'b-dir',
               '随推':'b-follow','回收':'b-recycle','减SKC':'b-cut','停加色':'b-stop'};
  const state = {group:'男内', idx:0, mode:'cat'};

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const css = v => /^[0-9a-fA-F]{3,8}$/.test(String(v || '')) ? '#' + v : String(v || '#fff');
  const badge = t => t ? '<span class="badge ' + (TAG[t] || 'b-follow') + '">' + esc(t) + '</span>' : '';
  const list = g => DATA.categories.filter(c => c.group === g);
  const cur = () => list(state.group)[state.idx];

  /* ---------- fixed head ---------- */
  (function head(){
    const c = DATA.cover;
    const q = o =>
      '<article class="qcard">' +
        '<div class="qh"><span class="qlab">' + esc(o.label) + '</span><h3>' + esc(o.title) + '</h3></div>' +
        '<p class="qsub">' + esc(o.sub) + '</p>' +
        '<ul class="qlines">' + o.lines.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul>' +
        (o.foot ? '<p class="qfoot">' + esc(o.foot) + '</p>' : '') +
      '</article>';
    document.getElementById('stageInner').innerHTML =
      '<div class="title-col">' +
        '<p class="eyebrow">' + esc(c.eyebrow) + '</p>' +
        '<h1>' + esc(c.title) + '</h1>' +
        '<p class="sub">' + esc(c.subtitle) + '</p>' +
        '<p class="tag">' + esc(c.tagline) + '</p>' +
        (c.lead ? '<p class="lead">' + esc(c.lead) + '</p>' : '') +
      '</div>' +
      '<div class="q-row">' + q(c.q1) + q(c.q2) + '</div>' +
      '<div class="blocks">' +
        c.blocks.map(b => '<div class="blk"><span class="no">' + esc(b.no) + '</span>' +
          '<div><h4>' + esc(b.title) + '</h4><p>' + esc(b.desc) + '</p></div></div>').join('') +
        '<div class="blk t"><h4>' + esc(c.trend.title) + '</h4><p>' + esc(c.trend.desc) + '</p></div>' +
      '</div>';
    document.getElementById('foot').innerHTML =
      '<span>' + esc(c.title) + ' · ' + esc(c.subtitle) + '</span>';
  })();

  /* ---------- nav ---------- */
  document.getElementById('seg').innerHTML = GROUPS.map(g =>
    '<button class="tab" role="tab" data-g="' + esc(g) + '" aria-selected="false">' +
    esc(g) + '<i>' + list(g).length + '</i></button>').join('');

  function renderChips(){
    const items = list(state.group);
    document.getElementById('chips').innerHTML = items.map((c, i) =>
      '<button class="chip' + (state.mode === 'cat' && i === state.idx ? ' on' : '') +
      '" data-i="' + i + '">' + esc(c.cat) + '</button>').join('');
    document.querySelectorAll('#seg .tab').forEach(b =>
      b.setAttribute('aria-selected', b.dataset.g === state.group ? 'true' : 'false'));
  }

  /* ---------- table ---------- */
  const COLW = [92, 74, 132, 210, 152, 100];
  function picksHTML(raw){
    if (!raw) return '';
    let head = '', rest = raw;
    const k = raw.indexOf('：');
    if (k > -1) { head = '<b>' + esc(raw.slice(0, k + 1)) + '</b>'; rest = raw.slice(k + 1); }
    const toks = rest.split(/\s+/).filter(Boolean)
      .map(t => '<span class="tok">' + esc(t) + '</span>').join(' ');
    return head + toks;
  }
  function tableHTML(c){
    const rows = c.table, n = rows.length - 1;
    const head = rows[0].map(h => '<th>' + esc(h) + '</th>').join('');
    let cg = '<colgroup>' + COLW.map(w => '<col style="width:' + w + 'px">').join('') +
             '<col style="width:auto">' + '</colgroup>';
    let body = '';
    for (let i = 1; i < rows.length; i++){
      const r = rows[i], p = (r[1] || '').toLowerCase();
      const cls = p === 'p0' ? 'pill p0' : (p === 'p1' ? 'pill p1' : 'pill');
      body += '<tr>';
      if (i === 1) body += '<td class="c1" rowspan="' + n + '">' + esc(r[0]) + '</td>';
      body += '<td class="pri"><span class="' + cls + '">' + esc(r[1]) + '</span></td>' +
              '<td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td>' +
              '<td class="num">' + esc(r[4]) + '</td>';
      if (i === 1) body += '<td class="width" rowspan="' + n + '">' + esc(r[5]) + '</td>';
      body += '<td class="picks">' + picksHTML(r[6]) + '</td></tr>';
    }
    return '<div class="tcard"><div class="twrap"><table>' + cg +
           '<thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
  }

  const vlist = (items, cls) => '<ul class="' + cls + '">' + items.map(it =>
    '<li><span class="sw" style="background:' + esc(css(it.color)) + '"></span>' +
    '<span class="nm">' + esc(it.name) + '</span>' + badge(it.tag) + '</li>').join('') + '</ul>';

  function catHTML(c){
    const total = list(c.group).length, i = state.idx;
    return '<article class="cat">' +
      '<div class="cat-top">' +
        '<div class="bignum">' + esc(c.pageno) + '</div>' +
        '<div class="cat-title"><span class="g">' + esc(c.group) + '</span>' +
          '<h2>' + esc(c.cat) + '<em>' + esc(c.pageno) + '</em></h2>' +
          '<p class="lede">' + esc(c.subtitle) + '</p></div>' +
        '<div class="pager">' +
          '<button class="pg" data-dir="-1"' + (i === 0 ? ' disabled' : '') + ' aria-label="上一品类">‹</button>' +
          '<span class="pgc"><b>' + (i + 1) + '</b> / ' + total + '</span>' +
          '<button class="pg" data-dir="1"' + (i === total - 1 ? ' disabled' : '') + ' aria-label="下一品类">›</button>' +
        '</div>' +
      '</div>' +
      tableHTML(c) +
      '<section class="edcard">' +
        '<div class="chead"><h3>品类颜色边际</h3><span class="tag">MARGINAL</span></div>' +
        '<p class="concl">' + esc(c.conclusion) + '</p>' +
      '</section>' +
      '<section class="vcard">' +
        '<div class="chead"><h3>' + esc(c.visual.title) + '</h3><span class="tag">OUT-OF-SITE</span></div>' +
        (c.visual.note ? '<p class="vnote">' + esc(c.visual.note) + '</p>' : '') +
        vlist(c.visual.items, 'vgrid') +
      '</section>' +
      '<div class="panels">' +
        '<section class="panel add">' +
          '<div class="chead"><h3>' + esc(c.add.title.replace(/\s+/g, ' ')) + '</h3></div>' +
          vlist(c.add.items, 'plist') + '</section>' +
        '<section class="panel drop">' +
          '<div class="chead"><h3>' + esc(c.drop.title.replace(/\s+/g, ' ')) + '</h3></div>' +
          vlist(c.drop.items, 'plist') + '</section>' +
      '</div>' +
      '<div class="ribbon"><span class="mk">SUMMARY</span><p>' + esc(c.bottom) + '</p></div>' +
    '</article>';
  }

  function trendHTML(){
    const t = DATA.trend;
    return '<article class="tview">' +
      '<div class="cat-top">' +
        '<div class="bignum">' + esc(t.page) + '</div>' +
        '<div class="cat-title"><span class="g">通用章节</span>' +
          '<h2>' + esc(t.title) + '<em>' + esc(t.page) + '</em></h2>' +
          '<p class="lede">' + esc(t.subtitle) + '</p></div>' +
      '</div>' +
      '<div class="tgrid">' + t.cols.map(col =>
        '<div class="tcol"><h4>' + esc(col.label) + '</h4>' + col.colors.map(c =>
          '<div class="tcw"><span class="box" style="background:' + esc(css(c.css)) + '"></span>' +
          '<div><div class="cn">' + esc(c.cn) + '</div><div class="en">' + esc(c.en) + '</div>' +
          '<div class="rgb">' + esc(c.rgb) + '</div></div></div>').join('') + '</div>').join('') +
      '</div>' +
      '<div class="tfoot">' + t.foot.map(f => '<p>' + esc(f) + '</p>').join('') + '</div>' +
    '</article>';
  }

  /* ---------- render ---------- */
  const view = document.getElementById('view');
  function paint(){
    view.classList.remove('view');
    void view.offsetWidth;
    view.innerHTML = state.mode === 'trend' ? trendHTML() : catHTML(cur());
    view.classList.add('view');
    renderChips();
    const top = document.querySelector('main').offsetTop - 8;
    if (window.scrollY > top) window.scrollTo({top: top, behavior: 'smooth'});
    const c = state.mode === 'trend' ? null : cur();
    try { history.replaceState(null, '', state.mode === 'trend' ? '#trend' : '#c-' + c.slide); } catch (err) {}
  }
  function goCat(i){
    const l = list(state.group);
    if (i < 0 || i >= l.length) return;
    state.idx = i; state.mode = 'cat'; paint();
  }
  function goGroup(g){
    if (GROUPS.indexOf(g) < 0) return;
    state.group = g; state.idx = 0; state.mode = 'cat'; paint();
  }

  document.getElementById('seg').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (b) goGroup(b.dataset.g);
  });
  document.getElementById('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (b) goCat(+b.dataset.i);
  });
  document.getElementById('trendBtn').addEventListener('click', () => { state.mode = 'trend'; paint(); });
  view.addEventListener('click', e => {
    const b = e.target.closest('.pg');
    if (b) goCat(state.idx + (+b.dataset.dir));
  });
  document.addEventListener('keydown', e => {
    if (state.mode !== 'cat') return;
    if (e.key === 'ArrowRight') goCat(state.idx + 1);
    if (e.key === 'ArrowLeft') goCat(state.idx - 1);
  });

  const hash = location.hash || '';
  if (hash === '#trend'){ state.mode = 'trend'; }
  else {
    const m = hash.match(/^#c-(\d+)$/);
    if (m){
      const t = DATA.categories.filter(c => String(c.slide) === m[1])[0];
      if (t){ state.group = t.group; state.idx = list(t.group).indexOf(t); }
    }
  }
  paint();
})();
